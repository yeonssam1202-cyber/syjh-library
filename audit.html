<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감사 보고서 · 작은도서관 운영위원회</title>
<script src="guard.js?v=12"></script>
<link rel="stylesheet" href="common.css?v=5">
<style>
  .list { display:flex; flex-direction:column; gap:10px; }
  .rcard { display:block; background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; color:inherit; text-decoration:none; }
  .rcard:hover { border-color:var(--accent); }
  .rcard .t { font-weight:600; font-size:17px; }
  .rcard .s { color:var(--muted); font-size:14px; margin-top:2px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .badge.ok2 { background:#e8f3ea; color:var(--ok); }
  .badge.warn2 { background:#fff3e0; color:#8a5a00; }
  .badge.bad2 { background:#fbeae6; color:var(--err); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px; }
  .wrapx { overflow-x:auto; }
  table.t { width:100%; border-collapse:collapse; font-size:14px; min-width:720px; }
  table.t th { background:#f5f7fb; border:1px solid var(--line); padding:8px 6px; text-align:center; white-space:nowrap; }
  table.t td { border:1px solid var(--line); padding:7px 8px; vertical-align:top; }
  table.t td.num, table.t th.num { text-align:right; white-space:nowrap; }
  table.t tfoot td { font-weight:700; background:#f7f9fc; }
  .flag { display:block; color:var(--err); font-size:13px; line-height:1.4; }
  .okmark { color:var(--ok); font-size:13px; }
  table.t select, table.t input[type=text] { padding:6px 8px; font-size:14px; }
  table.t select { min-width:104px; }
  table.t input[type=text] { min-width:150px; }
  .over { color:var(--err); font-weight:700; }
  .doc { background:#fff; border:1px solid var(--line); border-radius:8px; padding:26px 26px 18px; }
  .doc h2 { font-size:18px; margin:22px 0 8px; color:var(--navy); }
  .doc h2:first-of-type { margin-top:0; }
  .doc .title { text-align:center; font-size:26px; font-weight:700; color:var(--navy); margin:4px 0 18px; }
  table.kv { width:100%; border-collapse:collapse; font-size:15px; margin-bottom:6px; }
  table.kv th { width:150px; background:#f5f7fb; border:1px solid var(--line); padding:8px; text-align:center; }
  table.kv td { border:1px solid var(--line); padding:8px 10px; white-space:pre-wrap; word-break:break-word; }
  .txt { border:1px solid var(--line); border-radius:6px; padding:12px 14px; white-space:pre-wrap; word-break:break-word; min-height:54px; }
  .sigbox { display:flex; justify-content:flex-end; align-items:center; gap:16px; margin-top:18px; }
  .sigbox img { height:64px; max-width:240px; border-bottom:1px solid #999; }
  .proof { margin-top:12px; font-size:13px; color:var(--muted); line-height:1.5; }
  .sum4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:10px 0 4px; }
  .sum4 > div { border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:#fff; }
  .sum4 .n { font-size:20px; font-weight:700; }
  .sum4 .l { font-size:13px; color:var(--muted); }
  canvas#pad { width:100%; height:auto; aspect-ratio:480/176; border:1.5px dashed #999; border-radius:6px; touch-action:none; background:#fff; display:block; margin:10px 0 6px; }
  .agree { display:flex; align-items:flex-start; gap:8px; margin:10px 0; font-size:15px; }
  dialog { margin:auto; }
  @media (max-width:640px) { .grid2, .grid3 { grid-template-columns:1fr; } .sum4 { grid-template-columns:1fr 1fr; } .doc { padding:16px 12px; } table.kv th { width:96px; } }
  @page { size:A4; margin:16mm 14mm; }
  @media print {
    body { background:#fff; padding:0; font-size:11pt; }
    .noprint, #app-bar { display:none !important; }
    .doc { border:0; padding:0; }
    .wrapx { overflow:visible; }
    table.t { min-width:0; font-size:9pt; }
    h2 { break-after:avoid; }
    tr { break-inside:avoid; }
    .sigbox, .txt { break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="notice" class="notice noprint" role="alert"></div>
  <div id="app"></div>
</div>

<dialog id="sign-dlg">
  <div class="dlg">
    <h3>감사 서명</h3>
    <div class="hint" id="sign-who"></div>
    <canvas id="pad" width="480" height="176" aria-label="서명란"></canvas>
    <div class="hint">손가락이나 마우스로 서명란에 이름을 직접 써 주세요.</div>
    <label class="agree"><input type="checkbox" id="sign-agree"><span>위 감사 보고서의 내용을 확인했고, 이 서명이 본인의 서명임을 확인합니다. 제출하면 내용을 고칠 수 없어요.</span></label>
    <div class="bar" style="margin-bottom:0">
      <button class="ghost" id="sign-clear" type="button">지우기</button>
      <span class="sp"></span>
      <button class="ghost" id="sign-cancel" type="button">취소</button>
      <button class="primary" id="sign-ok" type="button">서명하고 제출</button>
    </div>
  </div>
</dialog>

<script src="ui.js?v=1"></script>
<script src="audit.js?v=2"></script>
</body>
</html>
