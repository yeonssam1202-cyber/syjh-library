<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 · 작은도서관 운영위원회</title>
<script src="guard.js?v=20"></script>
<link rel="stylesheet" href="common.css?v=5">
<style>
  .hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin:4px 0 16px; }
  .hero .hi { font-size:22px; font-weight:700; }
  .hero .sub { color:var(--muted); font-size:15px; }
  .todo { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .todo a { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:11px 14px; color:inherit; text-decoration:none; font-size:15.5px; box-shadow:var(--card-shadow); }
  .todo a:hover { background:#f7f9fc; }
  .todo a .go { margin-left:auto; color:var(--accent-700); font-weight:600; white-space:nowrap; }
  .todo a.warn { border-left-color:var(--err); }
  h2.sec { font-size:16px; font-weight:800; color:var(--navy); margin:0 0 8px; }
  .installtip { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:#fff4e0; border:1px solid #f0d9a8; border-left:4px solid #e0a030; border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .installtip .tx { display:flex; flex-direction:column; flex:1; min-width:200px; } .installtip .tx b { color:#6b4500; } .installtip .tx span { color:#8a5a00; font-size:14px; }
  .installtip .bt { display:flex; gap:8px; align-items:center; }
  .installtip .go { background:#1f4b8f; color:#fff; font-weight:700; border-radius:8px; padding:9px 14px; text-decoration:none; white-space:nowrap; }
  .installtip button { background:transparent; border:1px solid #d6b878; color:#8a5a00; border-radius:8px; padding:8px 12px; }
  .kpi { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
  .kpi-c { display:flex; flex-direction:column; background:#fff; border-radius:10px; border:1px solid var(--line); border-top:4px solid #c3cde0; padding:12px 16px; color:inherit; text-decoration:none; box-shadow:var(--card-shadow); }
  .kpi-c b { font-size:32px; line-height:1.15; color:#98a2b3; }
  .kpi-c span { font-size:14px; color:var(--muted); }
  .kpi-c.on b { color:var(--navy); }
  .kpi-c.red.on { border-top-color:#b3402b; } .kpi-c.blue.on { border-top-color:#1f4b8f; } .kpi-c.purple.on { border-top-color:#7b4ea3; } .kpi-c.green.on { border-top-color:#2f8f6b; }
  .kpi-c:hover { background:#f7f9fc; }
  .quick { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
  .quick a, .quick button { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:13px 16px; color:var(--navy); font:inherit; font-weight:700; text-decoration:none; text-align:left; cursor:pointer; box-shadow:var(--card-shadow); }
  .quick a:hover, .quick button:hover { background:#f3f7fd; }
  .quick .qi { width:22px; height:22px; fill:none; stroke:var(--accent); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .allclear { background:#e8f3ea; color:var(--ok); border-radius:8px; padding:12px 14px; margin-bottom:16px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .card2 { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; }
  .card2 h2 { font-size:17px; color:var(--navy); margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card2 h2 a { font-size:14px; font-weight:500; color:var(--accent-700); text-decoration:none; }
  .row { padding:9px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row .t { font-weight:600; }
  .row .s { color:var(--muted); font-size:14px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .rsvp button { padding:9px 16px; }
  .rsvp button.sel { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  .nbadge { display:inline-block; background:#fde8e4; color:var(--err); border-radius:999px; padding:0 8px; font-size:12px; font-weight:700; margin-left:6px; }
  /* 달력 */
  .calwrap { display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start; margin-bottom:16px; }
  .calmain, .calday { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; }
  .calhead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .calhead .ttl { font-size:22px; font-weight:700; color:var(--navy); }
  .calhead .nav { display:flex; gap:6px; }
  .calgrid { display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .calgrid .dow { text-align:center; padding:6px 0; font-size:13px; color:var(--muted); background:#f7f9fc; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .calgrid .dow.sun, .cell.sun .dn { color:#b03a2e; } .calgrid .dow.sat, .cell.sat .dn { color:#2d5aa8; }
  .cell { display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; text-align:left; background:#fff; border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0; min-height:96px; padding:5px 6px; font-size:12px; cursor:pointer; overflow:hidden; }
  .cell.empty { background:#fafbfc; cursor:default; }
  .cell:hover:not(.empty) { background:#f3f7fd; }
  .cell.today .dn { background:var(--accent); color:#fff; border-radius:999px; width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
  .cell.sel { box-shadow:inset 0 0 0 2px var(--accent); background:#eef3fb; }
  .cell .dn { font-size:14px; font-weight:600; margin-bottom:3px; width:24px; height:24px; display:flex; align-items:center; }
  .chip2 { border-left:3px solid; padding:1px 5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#f3f5f8; border-radius:2px; color:var(--text); line-height:1.4; }
  .chip2.ev { border-color:#14305c; background:#e8edf5; } .chip2.task { border-color:#c27a1a; background:#fdf3e3; } .chip2.shift { border-color:#2f8f6b; background:#e6f4ee; } .chip2.cal { border-color:#7b4ea3; background:#f0e9f7; }
  .chip2.mine { font-weight:700; } .chip2.done { text-decoration:line-through; opacity:.6; }
  .cell .more { color:var(--muted); font-size:11px; padding-left:4px; }
  .dots { display:none; gap:3px; margin-top:2px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#999; }
  .dot.ev { background:#14305c; } .dot.task { background:#c27a1a; } .dot.shift { background:#2f8f6b; } .dot.cal { background:#7b4ea3; }
  .legend2 { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:10px; }
  .calday h3 { font-size:17px; color:var(--navy); margin-bottom:8px; }
  .ditem { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); color:inherit; text-decoration:none; font-size:15px; }
  .ditem:first-of-type { border-top:0; }
  .ditem .k { font-size:12px; color:var(--muted); min-width:56px; }
  .ditem .tt.mine { font-weight:700; } .ditem .tt.done { text-decoration:line-through; opacity:.6; }
  @media (max-width:760px) {
    .kpi { grid-template-columns:repeat(2,1fr); }
    .quick { grid-template-columns:repeat(2,1fr); }
    .cols, .calwrap { grid-template-columns:1fr; } .hero img { height:44px; }
    .cell { min-height:54px; padding:3px 2px; text-align:center; } .cell .dn { margin:0 auto 2px; } .chips2 { display:none; } .dots { display:flex; justify-content:center; }
    .calmain, .calday { padding:12px 10px; } .calhead .ttl { font-size:19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="notice" class="notice noprint" role="alert"></div>
  <div id="app"></div>
</div>
<dialog id="c-dlg">
  <form class="dlg" id="c-form" method="dialog">
    <h3 id="c-head">공유 일정 추가</h3>
    <label class="l" for="c-title">제목</label>
    <input type="text" id="c-title" maxlength="100" required placeholder="예: 입주자대표회의 정기회의">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">
      <div><label class="l" for="c-cat">구분</label><select id="c-cat"><option>입대의 회의</option><option>관리사무소</option><option>행사·교육</option><option>기타</option></select></div>
      <div><label class="l" for="c-place">장소 (선택)</label><input type="text" id="c-place" maxlength="100"></div>
      <div><label class="l" for="c-date">날짜</label><input type="date" id="c-date" required></div>
      <div><label class="l" for="c-end">끝나는 날 (며칠 걸리면)</label><input type="date" id="c-end"></div>
      <div><label class="l" for="c-start">시작 시각 (선택)</label><input type="time" id="c-start"></div>
      <div><label class="l" for="c-endt">종료 시각 (선택)</label><input type="time" id="c-endt"></div>
    </div>
    <label class="l" for="c-note">메모 (선택)</label>
    <input type="text" id="c-note" maxlength="500" placeholder="예: 도서관 관련 안건 있음">
    <div class="bar" style="margin-bottom:0"><button class="ghost danger" type="button" id="c-del" style="display:none">지우기</button><span class="sp"></span>
      <button class="ghost" type="button" id="c-cancel">취소</button><button class="primary" type="submit" id="c-save">저장</button></div>
  </form>
</dialog>
<script src="ui.js?v=1"></script>
<script src="home.js?v=10"></script>
</body>
</html>
