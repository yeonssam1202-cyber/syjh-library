<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 · 작은도서관 운영위원회</title>
<script src="guard.js?v=13"></script>
<link rel="stylesheet" href="common.css?v=5">
<style>
  .hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin:4px 0 16px; }
  .hero img { height:54px; width:auto; display:block; }
  .hero .hi { font-size:22px; font-weight:700; }
  .hero .sub { color:var(--muted); font-size:15px; }
  .todo { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .todo a { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:12px 14px; color:inherit; text-decoration:none; font-size:16px; }
  .todo a:hover { background:#f7f9fc; }
  .todo a .go { margin-left:auto; color:var(--accent-700); font-weight:600; white-space:nowrap; }
  .todo a.warn { border-left-color:var(--err); }
  .allclear { background:#e8f3ea; color:var(--ok); border-radius:8px; padding:12px 14px; margin-bottom:16px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .card2 { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; }
  .card2 h2 { font-size:17px; color:var(--navy); margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card2 h2 a { font-size:14px; font-weight:500; color:var(--accent-700); text-decoration:none; }
  .row { padding:9px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row .t { font-weight:600; }
  .row .s { color:var(--muted); font-size:14px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .rsvp button { padding:9px 16px; }
  .rsvp button.sel { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  .nbadge { display:inline-block; background:#fde8e4; color:var(--err); border-radius:999px; padding:0 8px; font-size:12px; font-weight:700; margin-left:6px; }
  /* 달력 */
  .calwrap { display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start; margin-bottom:16px; }
  .calmain, .calday { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; }
  .calhead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .calhead .ttl { font-size:22px; font-weight:700; color:var(--navy); }
  .calhead .nav { display:flex; gap:6px; }
  .calgrid { display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .calgrid .dow { text-align:center; padding:6px 0; font-size:13px; color:var(--muted); background:#f7f9fc; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .calgrid .dow.sun, .cell.sun .dn { color:#b03a2e; } .calgrid .dow.sat, .cell.sat .dn { color:#2d5aa8; }
  .cell { display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; text-align:left; background:#fff; border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0; min-height:96px; padding:5px 6px; font-size:12px; cursor:pointer; overflow:hidden; }
  .cell.empty { background:#fafbfc; cursor:default; }
  .cell:hover:not(.empty) { background:#f3f7fd; }
  .cell.today .dn { background:var(--accent); color:#fff; border-radius:999px; width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
  .cell.sel { box-shadow:inset 0 0 0 2px var(--accent); background:#eef3fb; }
  .cell .dn { font-size:14px; font-weight:600; margin-bottom:3px; width:24px; height:24px; display:flex; align-items:center; }
  .chip2 { border-left:3px solid; padding:1px 5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#f3f5f8; border-radius:2px; color:var(--text); line-height:1.4; }
  .chip2.ev { border-color:#14305c; background:#e8edf5; } .chip2.task { border-color:#c27a1a; background:#fdf3e3; } .chip2.shift { border-color:#2f8f6b; background:#e6f4ee; }
  .chip2.mine { font-weight:700; } .chip2.done { text-decoration:line-through; opacity:.6; }
  .cell .more { color:var(--muted); font-size:11px; padding-left:4px; }
  .dots { display:none; gap:3px; margin-top:2px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#999; }
  .dot.ev { background:#14305c; } .dot.task { background:#c27a1a; } .dot.shift { background:#2f8f6b; }
  .legend2 { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:10px; }
  .calday h3 { font-size:17px; color:var(--navy); margin-bottom:8px; }
  .ditem { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); color:inherit; text-decoration:none; font-size:15px; }
  .ditem:first-of-type { border-top:0; }
  .ditem .k { font-size:12px; color:var(--muted); min-width:56px; }
  .ditem .tt.mine { font-weight:700; } .ditem .tt.done { text-decoration:line-through; opacity:.6; }
  @media (max-width:760px) {
    .cols, .calwrap { grid-template-columns:1fr; } .hero img { height:44px; }
    .cell { min-height:54px; padding:3px 2px; text-align:center; } .cell .dn { margin:0 auto 2px; } .chips2 { display:none; } .dots { display:flex; justify-content:center; }
    .calmain, .calday { padding:12px 10px; } .calhead .ttl { font-size:19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="notice" class="notice noprint" role="alert"></div>
  <div id="app"></div>
</div>
<script src="ui.js?v=1"></script>
<script src="home.js?v=3"></script>
</body>
</html>
