<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작은도서관 운영위원회 · 로그인</title>
<style>
  :root { --bg:#ffffff; --text:#201f1d; --muted:#6c6b69; --accent:#1f4b8f; --accent-700:#14305c; --line:#dde3ec; --err:#a8321f; --ok:#2f6b3a; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg); color:var(--text); font:16px/1.6 "IBM Plex Sans KR","Malgun Gothic",-apple-system,sans-serif; }
  .card { width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:36px 32px; }
  .mark { font-size:13px; letter-spacing:.06em; color:var(--accent-700); }
  h1 { font-size:26px; font-weight:600; margin:4px 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:22px; }
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:20px; }
  .tabs button { flex:1; background:none; border:0; padding:10px 0; font:inherit; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  label { display:block; font-size:14px; margin:14px 0 4px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:4px; font:inherit; background:#fff; }
  input:focus { outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent); border-color:var(--accent); }
  .submit { width:100%; margin-top:22px; padding:12px; border:0; border-radius:4px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .submit:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:16px; padding:10px 12px; border-radius:4px; font-size:14px; display:none; }
  .msg.err { display:block; background:#fbeae6; color:var(--err); }
  .msg.ok { display:block; background:#e8f3ea; color:var(--ok); }
  .msg.info { display:block; background:#e8edf5; color:var(--accent-700); }
  .hint { color:var(--muted); font-size:14px; margin-top:6px; }
  .linkbtn { display:block; margin:14px auto 0; background:none; border:0; color:var(--accent-700); font:inherit; font-size:14px; text-decoration:underline; cursor:pointer; padding:4px 8px; }
  .privacy { margin-top:18px; padding:12px 14px; background:#f6f8fb; border:1px solid var(--line); border-radius:4px; font-size:14px; }
  .privacy ul { margin:6px 0 0 18px; padding:0; color:var(--muted); }
  .agree { display:flex; align-items:center; gap:8px; margin-top:14px; cursor:pointer; }
  .agree input { width:20px; height:20px; accent-color:var(--accent-700); }
  .hide { display:none; }
  .logo { display:block; width:min(220px,62%); height:auto; margin:2px auto 18px; }
  main.card > .mark, main.card > h1, main.card > .sub { text-align:center; }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="logo.png" alt="The Platinum">
  <div class="mark">작은도서관 운영위원회</div>
  <h1>업무공간</h1>
  <p class="sub">운영위원만 이용할 수 있어요. 가입 신청 후 관리자가 승인하면 로그인할 수 있습니다.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-login" aria-selected="true">로그인</button>
    <button role="tab" id="tab-signup" aria-selected="false">가입 신청</button>
  </div>

  <form id="form-login" autocomplete="on">
    <label for="l-email">이메일</label>
    <input id="l-email" type="email" required autocomplete="email">
    <label for="l-pw">비밀번호</label>
    <input id="l-pw" type="password" required autocomplete="current-password">
    <button class="submit" type="submit">로그인</button>
    <button class="linkbtn" type="button" id="btn-forgot">비밀번호를 잊으셨나요?</button>
  </form>

  <form id="form-reset" class="hide" autocomplete="on">
    <label for="r-pw">새 비밀번호</label>
    <input id="r-pw" type="password" required minlength="8" autocomplete="new-password">
    <div class="hint">8자 이상으로 정해 주세요.</div>
    <label for="r-pw2">새 비밀번호 한 번 더</label>
    <input id="r-pw2" type="password" required minlength="8" autocomplete="new-password">
    <button class="submit" type="submit">비밀번호 바꾸기</button>
  </form>

  <form id="form-signup" class="hide" autocomplete="on">
    <label for="s-name">이름</label>
    <input id="s-name" type="text" required autocomplete="name" maxlength="30">
    <label for="s-email">이메일</label>
    <input id="s-email" type="email" required autocomplete="email">
    <label for="s-pw">비밀번호</label>
    <input id="s-pw" type="password" required minlength="8" autocomplete="new-password">
    <div class="hint">8자 이상으로 정해 주세요.</div>
    <div class="privacy">
      <strong>개인정보 수집·이용 안내</strong>
      <ul>
        <li>수집 항목: 이름, 이메일, 비밀번호(암호화 저장)</li>
        <li>이용 목적: 운영위원 본인 확인, 가입 승인, 업무 배정·연락</li>
        <li>보관 기간: 운영위원으로 활동하는 동안. 위원 자격이 끝나거나 삭제를 요청하시면 삭제합니다.</li>
        <li>동의하지 않으셔도 되지만, 이 경우 가입할 수 없어요.</li>
      </ul>
    </div>
    <label class="agree"><input id="s-agree" type="checkbox" required> 위 내용을 읽었고 동의합니다</label>
    <button class="submit" type="submit">가입 신청</button>
  </form>

  <div id="msg" class="msg" role="status"></div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg");
  function show(kind, text) { msg.className = "msg " + kind; msg.textContent = text; }
  function clear() { msg.className = "msg"; msg.textContent = ""; }

  function setTab(login) {
    $("tab-login").setAttribute("aria-selected", login);
    $("tab-signup").setAttribute("aria-selected", !login);
    $("form-login").classList.toggle("hide", !login);
    $("form-signup").classList.toggle("hide", login);
    $("form-reset").classList.add("hide");
    document.querySelector(".tabs").classList.remove("hide");
    clear();
  }
  $("tab-login").onclick = function () { setTab(true); };
  $("tab-signup").onclick = function () { setTab(false); };

  function errText(e) {
    var m = (e && e.message) || "";
    if (/Invalid login credentials/i.test(m)) return "이메일 또는 비밀번호가 맞지 않아요.";
    if (/already registered|already been registered/i.test(m)) return "이미 가입 신청된 이메일이에요. 로그인해 보세요.";
    if (/Email not confirmed/i.test(m)) return "이메일 인증이 아직 안 됐어요. 받은 메일의 링크를 눌러 주세요.";
    if (/rate limit/i.test(m)) return "잠시 후 다시 시도해 주세요.";
    return "처리하지 못했어요: " + m;
  }

  if (!Auth.configured) {
    show("info", "아직 로그인 서비스(Supabase)가 연결되지 않았어요. README.md의 안내대로 config.js를 채워 주세요.");
    document.querySelectorAll(".submit").forEach(function (b) { b.disabled = true; });
    return;
  }

  async function routeByStatus() {
    var p = await Auth.getProfile();
    if (!p) return;
    if (p.status === "approved") { location.replace("app.html"); return; }
    await Auth.client.auth.signOut();
    show("info", p.status === "rejected"
      ? "가입이 승인되지 않았어요. 관리자에게 문의해 주세요."
      : "아직 관리자 승인 대기 중이에요. 승인되면 로그인할 수 있어요.");
  }

  $("form-login").onsubmit = async function (e) {
    e.preventDefault(); clear();
    var btn = e.target.querySelector(".submit"); btn.disabled = true;
    var r = await Auth.client.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pw").value });
    btn.disabled = false;
    if (r.error) { show("err", errText(r.error)); return; }
    await routeByStatus();
  };

  $("form-signup").onsubmit = async function (e) {
    e.preventDefault(); clear();
    var btn = e.target.querySelector(".submit"); btn.disabled = true;
    var r = await Auth.client.auth.signUp({
      email: $("s-email").value.trim(), password: $("s-pw").value,
      options: { data: { name: $("s-name").value.trim() } }
    });
    btn.disabled = false;
    if (r.error) { show("err", errText(r.error)); return; }
    await Auth.client.auth.signOut();
    e.target.reset();
    show("ok", "가입 신청이 접수됐어요. 관리자가 승인하면 로그인할 수 있습니다.");
  };

  // 비밀번호 찾기: 메일의 링크로 돌아오면 새 비밀번호 입력 화면을 보여 줍니다.
  var base = location.href.replace(/[#?].*$/, "").replace(/[^/]*$/, "");
  $("btn-forgot").onclick = async function () {
    clear();
    var email = $("l-email").value.trim();
    if (!email) { show("err", "위의 이메일 칸에 가입한 이메일을 먼저 적어 주세요."); $("l-email").focus(); return; }
    var r = await Auth.client.auth.resetPasswordForEmail(email, { redirectTo: base + "index.html" });
    if (r.error) { show("err", errText(r.error)); return; }
    show("ok", "가입된 이메일이라면 비밀번호를 바꾸는 링크를 보냈어요. 메일이 안 보이면 스팸함도 확인해 주세요.");
  };

  function showResetForm() {
    $("form-login").classList.add("hide");
    $("form-signup").classList.add("hide");
    document.querySelector(".tabs").classList.add("hide");
    $("form-reset").classList.remove("hide");
    $("r-pw").focus();
  }

  $("form-reset").onsubmit = async function (e) {
    e.preventDefault(); clear();
    if ($("r-pw").value !== $("r-pw2").value) { show("err", "두 비밀번호가 서로 달라요. 다시 확인해 주세요."); return; }
    var btn = e.target.querySelector(".submit"); btn.disabled = true;
    var r = await Auth.client.auth.updateUser({ password: $("r-pw").value });
    btn.disabled = false;
    if (r.error) { show("err", /same|different/i.test(r.error.message) ? "이전과 다른 비밀번호로 정해 주세요." : errText(r.error)); return; }
    await Auth.client.auth.signOut();
    history.replaceState(null, "", location.pathname);
    e.target.reset();
    setTab(true);
    show("ok", "비밀번호를 바꿨어요. 새 비밀번호로 로그인해 주세요.");
  };

  var hash = location.hash || "";
  if (/type=recovery/.test(hash)) {
    showResetForm();                       // 새 비밀번호를 정하기 전에는 화면으로 보내지 않음
  } else if (/error_code=otp_expired|error=access_denied/.test(hash)) {
    history.replaceState(null, "", location.pathname);
    show("err", "링크가 만료됐거나 이미 사용됐어요. '비밀번호를 잊으셨나요?'를 눌러 새 링크를 받아 주세요.");
  } else {
    routeByStatus();
  }
})();
</script>
</body>
</html>
