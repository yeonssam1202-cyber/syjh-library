<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회칙·세칙 · 작은도서관 운영위원회</title>
<script src="guard.js?v=11"></script>
<link rel="stylesheet" href="common.css?v=4">
<style>
  .sumcard { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .sumcard h3 { font-size:16px; color:var(--navy); margin-bottom:6px; }
  .sumcard ul { margin:0 0 0 18px; padding:0; font-size:15px; }
  .sumcard li { margin:2px 0; }
  .sumcard .ref { color:var(--muted); font-size:13px; }
  .metaline { color:var(--muted); font-size:14px; margin:2px 0 10px; }
  .sumhead { cursor:pointer; font-weight:600; color:var(--navy); margin-bottom:10px; padding:6px 0; }
  .search { display:flex; gap:8px; margin:8px 0 12px; }
  .search .ghost { white-space:nowrap; flex:none; }
  .layout { display:grid; grid-template-columns:230px 1fr; gap:16px; align-items:start; }
  .toc { position:sticky; top:12px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; max-height:calc(100vh - 40px); overflow:auto; font-size:14px; }
  .toc a { display:block; color:var(--text); text-decoration:none; padding:3px 0; }
  .toc a:hover { color:var(--accent-700); }
  .toc a.ch { font-weight:600; margin-top:8px; color:var(--navy); }
  .doc { background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px 24px; }
  .doc h2.ch { font-size:19px; color:var(--navy); margin:22px 0 8px; padding-bottom:4px; border-bottom:1.5px solid var(--navy); }
  .doc h2.ch:first-child { margin-top:0; }
  .art { margin:12px 0; scroll-margin-top:12px; }
  .art .ah { font-weight:600; font-size:16px; }
  .art .ab { white-space:pre-wrap; word-break:break-word; font-size:15.5px; margin-top:2px; }
  .art.add .ah { color:var(--navy); }
  mark { background:#ffe9a8; padding:0 1px; border-radius:2px; }
  .hist { font-size:14px; }
  .hist button { margin:2px 4px 2px 0; }
  .note { font-size:14px; color:var(--muted); background:#f6f8fb; border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:12px 0; }
  textarea#f-body { min-height:300px; font-family:inherit; }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; } .toc { position:static; max-height:220px; } .doc { padding:16px 14px; } }
  @media print { .layout { display:block; } .toc, .search, .sumcards { display:none !important; } .doc { border:0; padding:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="notice" class="notice noprint" role="alert"></div>
  <div id="app"></div>
</div>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h3>원문 등록 · 개정</h3>
    <div class="hint">새 버전으로 쌓여요. 이전 버전은 "개정 이력"에 그대로 남아요.</div>
    <div class="grid2">
      <div><label class="l" for="f-kind">구분</label><select id="f-kind"><option>회칙</option><option>세칙</option></select></div>
      <div><label class="l" for="f-date">시행일</label><input type="date" id="f-date"></div>
    </div>
    <label class="l" for="f-note">개정 사유 (선택)</label>
    <input type="text" id="f-note" maxlength="500" placeholder="예: 최초 제정 / 제6조 개정">
    <label class="l" for="f-body">원문 전체</label>
    <textarea id="f-body" required placeholder="장·조문 전체를 붙여 넣어 주세요.&#10;제1장 총칙&#10;제1조(명칭) …"></textarea>
    <div class="hint">"제1장", "제1조(제목)", "부칙"으로 시작하는 줄을 자동으로 제목으로 나눠 보여 줘요.</div>
    <div class="bar" style="margin-bottom:0">
      <span class="sp"></span>
      <button class="ghost" type="button" id="f-cancel">취소</button>
      <button class="primary" type="submit" id="f-save">등록</button>
    </div>
  </form>
</dialog>

<script src="ui.js?v=1"></script>
<script src="rules.js?v=1"></script>
</body>
</html>
