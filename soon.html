<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준비 중 · 작은도서관 운영위원회</title>
<script src="guard.js?v=11"></script>
<style>
  :root { --bg:#ffffff; --text:#201f1d; --muted:#6c6b69; --accent:#1f4b8f; --accent-700:#14305c; --line:#dde3ec; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.7 "IBM Plex Sans KR","Malgun Gothic",-apple-system,sans-serif; padding:72px 20px 60px; }
  .card { max-width:560px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:8px; padding:36px 32px; }
  .mark { font-size:14px; letter-spacing:.06em; color:var(--accent-700); }
  h1 { font-size:26px; font-weight:600; margin:4px 0 12px; }
  .badge { display:inline-block; font-size:14px; background:#e8edf5; color:var(--accent-700); border-radius:999px; padding:2px 12px; margin-bottom:14px; }
  p { margin:0 0 12px; }
  ul { margin:0 0 18px 20px; padding:0; color:var(--muted); }
  .links { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .links a { display:inline-block; padding:11px 16px; border-radius:4px; text-decoration:none; font-weight:600; font-size:15px; border:1px solid var(--line); color:var(--accent-700); background:#fff; }
  .links a.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
</style>
</head>
<body>
<main class="card">
  <div class="mark">작은도서관 운영위원회</div>
  <h1 id="title">준비 중이에요</h1>
  <span class="badge">준비 중</span>
  <p id="lead">이 메뉴는 아직 만드는 중이에요.</p>
  <ul id="list"></ul>
  <p>만드는 순서와 필요한 내용은 위원회에서 정해 주시면 그대로 맞춰 만들게요.</p>
  <div class="links">
    <a class="primary" href="app.html">홈으로</a>
    <a href="tasks.html">업무 목록</a>
    <a href="minutes.html">회의록</a>
  </div>
</main>
<script>
(function () {
  var M = {
    budget: { t: "예산·지출", lead: "올해 예산과 지출을 함께 기록하는 화면이에요.",
      items: ["예산 항목별 편성액과 집행률", "지출 기록(영수증 사진 첨부)", "회의운영비·다과비 한도 확인(1인 5,000원)"] },
    shift: { t: "근무표", lead: "도서관을 여는 날 누가 맡을지 정하는 화면이에요.",
      items: ["월별 근무표", "근무 신청과 교대", "자원봉사자 일정"] },
    loan: { t: "대출 관리", lead: "대출·반납은 하지 않기로 해서 당분간 만들지 않아요.",
      items: ["대출·반납 운영 방식이 정해지면 다시 검토해요"] },
    rules: { t: "회칙·세칙", lead: "운영위원회 회칙과 세칙을 한곳에서 보는 화면이에요.",
      items: ["회칙 · 세칙 원문", "개정 이력", "회의록의 의결 사항과 연결"] }
  };
  var m = M[new URLSearchParams(location.search).get("m")];
  if (!m) return;
  document.title = m.t + " · 작은도서관 운영위원회";
  document.getElementById("title").textContent = m.t;
  document.getElementById("lead").textContent = m.lead;
  var ul = document.getElementById("list");
  m.items.forEach(function (x) { var li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
})();
</script>
</body>
</html>
